name: Publish FACE LAB Web App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "FaceLabAI_ULTRA_4_Source.zip"
      - ".github/workflows/publish-face-lab-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Extract FACE LAB web app
        run: |
          rm -rf extracted _site
          mkdir -p extracted _site
          unzip -q FaceLabAI_ULTRA_4_Source.zip -d extracted
          test -f extracted/FaceLabAI_ULTRA/app/src/main/assets/index.html
          cp extracted/FaceLabAI_ULTRA/app/src/main/assets/index.html _site/index.html
          touch _site/.nojekyll
          echo "Published FACE LAB web app"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
