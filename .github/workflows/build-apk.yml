name: Build FACE LAB AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "FaceLabAI_ULTRA_4_Source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract FACE LAB AI source
        run: |
          rm -rf FaceLabAI_ULTRA
          unzip -q FaceLabAI_ULTRA_4_Source.zip
          test -f FaceLabAI_ULTRA/settings.gradle
          test -f FaceLabAI_ULTRA/app/build.gradle

      - name: Build debug APK
        working-directory: FaceLabAI_ULTRA
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp FaceLabAI_ULTRA/app/build/outputs/apk/debug/app-debug.apk FACE-LAB-AI-4.0.apk
          ls -lh FACE-LAB-AI-4.0.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FACE-LAB-AI-4.0-APK
          path: FACE-LAB-AI-4.0.apk
          if-no-files-found: error
          retention-days: 30
