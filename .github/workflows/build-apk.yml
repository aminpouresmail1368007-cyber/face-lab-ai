name: Build FACE LAB AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "FaceLabAI_ULTRA_4_Source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract FACE LAB AI source
        run: |
          unzip -q FaceLabAI_ULTRA_4_Source.zip
          test -f FaceLabAI_ULTRA/settings.gradle
          test -f FaceLabAI_ULTRA/app/build.gradle

      - name: Build debug APK
        working-directory: FaceLabAI_ULTRA
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp FaceLabAI_ULTRA/app/build/outputs/apk/debug/app-debug.apk FACE-LAB-AI-4.0.apk
          ls -lh FACE-LAB-AI-4.0.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FACE-LAB-AI-4.0-APK
          path: FACE-LAB-AI-4.0.apk
          if-no-files-found: error
          retention-days: 30
