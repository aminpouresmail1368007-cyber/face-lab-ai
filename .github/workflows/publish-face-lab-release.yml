name: Publish FACE LAB 7.2.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-face-lab-release.yml"

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract FACE LAB source
        run: |
          rm -rf FaceLabAI_ULTRA
          unzip -q FaceLabAI_ULTRA_4_Source.zip
          test -f FaceLabAI_ULTRA/settings.gradle
          test -f FaceLabAI_ULTRA/app/build.gradle

      - name: Build APK
        working-directory: FaceLabAI_ULTRA
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp FaceLabAI_ULTRA/app/build/outputs/apk/debug/app-debug.apk FACE-LAB-7.2.1.apk
          ls -lh FACE-LAB-7.2.1.apk

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FACE-LAB-7.2.1-APK
          path: FACE-LAB-7.2.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v7.2.1 >/dev/null 2>&1; then
            gh release upload v7.2.1 FACE-LAB-7.2.1.apk --clobber
          else
            gh release create v7.2.1 FACE-LAB-7.2.1.apk \
              --title "FACE LAB 7.2.1" \
              --notes "FACE LAB 7.2.1 — Android APK. Creator: Dr. Amin Pouresmail."
          fi
